[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "scientific-agent-skills"
version = "1.0.0"
description = "A curated collection of open Agent Skills that turn coding assistants into stronger research assistants for science and engineering work."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Scientific Agent Skills Contributors" }
]
keywords = [
    "agent-skills",
    "scientific-computing",
    "bioinformatics",
    "drug-discovery",
    "cheminformatics",
    "machine-learning",
    "research",
    "ai-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# This package ships documentation/skills, not importable Python code.
# Dependencies below are for the repo's *tooling* (scanners, validators, tests).
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "skills-ref>=0.1",
]
scanner = [
    "cisco-ai-skill-scanner>=0.1",
]

[project.urls]
Homepage = "https://github.com/Pratikrishi97/scientific-agent-skills"
Documentation = "https://github.com/Pratikrishi97/scientific-agent-skills#readme"
Repository = "https://github.com/Pratikrishi97/scientific-agent-skills"
Issues = "https://github.com/Pratikrishi97/scientific-agent-skills/issues"
Changelog = "https://github.com/Pratikrishi97/scientific-agent-skills/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  security-scan:
    name: Cisco AI Skill Scanner
    runs-on: ubuntu-latest
    # The scanner is optional — this job degrades gracefully if the tool
    # isn't available, so it never blocks a PR on tooling availability.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          pip install cisco-ai-skill-scanner || echo "scanner not on PyPI yet; skipping"

      - name: Scan skills
        run: |
          command -v skills-scan >/dev/null 2>&1 && \
            skills-s scan skills/ --format json --out scan-report.json || \
            echo "cisco-ai-skill-scanner CLI unavailable; this is non-blocking"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: scan-report.json
          if-no-files-found: ignore

  secret-scan:
    name: Secret & credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified
